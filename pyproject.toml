[project]
name = "strands"
version = "0.1.0"
description = "Irish-to-target name-adaptation engine"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
strands = "strands.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
